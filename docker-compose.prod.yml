services:
  backend:
      build:
        context: ./services/core
        dockerfile: docker/Dockerfile
      restart: always
      command: ["/bin/sh", "docker/entrypoint.sh"]
      volumes:
        - ./services/core:/app
        - static_volume:/app/staticfiles
      ports:
        - "8000:8000"
      env_file:
        - ./services/core/env/.env
      environment:
        DJANGO_SETTINGS_MODULE: config.settings.production
        UV_LINK_MODE: copy
        UV_PROJECT_ENVIRONMENT: /opt/venv

  celery:
    build:
      context: ./services/core
      dockerfile: docker/Dockerfile
    restart: always
    command: uv run celery -A config.celery worker --loglevel=info --concurrency=4 --max-tasks-per-child=10 --max-memory-per-child=500000
    volumes:
      - ./services/core:/app
    env_file:
      - ./services/core/env/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  celery-beat:
    build:
      context: ./services/core
      dockerfile: docker/Dockerfile
    restart: always
    command: uv run celery -A config.celery beat --loglevel=info
    volumes:
      - ./services/core:/app
    env_file:
      - ./services/core/env/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - POOL_MODE=transaction
      - MAX_DB_CONNECTIONS=20
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:5432"

volumes:
  static_volume:
