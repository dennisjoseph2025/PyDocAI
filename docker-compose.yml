
services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      restart: always
      command: ["bash", "entrypoint.sh"]
      volumes:
        - ./backend:/app
        - static_volume:/app/staticfiles
      ports:
        - "8000:8000"
      env_file:
        - ./backend/.env
      environment:
        DJANGO_SETTINGS_MODULE: config.settings.production
        UV_LINK_MODE: copy
        UV_PROJECT_ENVIRONMENT: /opt/venv
      depends_on:
        redis:
          condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uv run celery -A config.celery worker --loglevel=info --concurrency=4 --max-tasks-per-child=10 --max-memory-per-child=500000
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uv run celery -A config.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      - DATABASE_URL=postgres://pydocai_user:pydocai_pass@db:5432/pydocai
      - POOL_MODE=transaction
      - MAX_DB_CONNECTIONS=20
    ports:
      - "6432:5432"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  static_volume: