<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 40px; }
    .header { background: #1a1a2e; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; margin: -40px -40px 30px; }
    .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .value { font-size: 15px; color: #333; margin-bottom: 16px; }
    .reply-box { background: #f8f8ff; border-left: 4px solid #6c63ff; padding: 16px; margin: 16px 0; border-radius: 4px; }
    .footer { color: #888; font-size: 13px; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>New Reply on Your Feedback</h1></div>
    <p>Hi <strong>{{ user.name }}</strong>,</p>
    <p>You have received a reply from our team regarding your feedback:</p>
    <p class="label">Your Original Message</p>
    <p class="value">{{ feedback.message }}</p>
    <p class="label">Reply from {{ reply.user.name }}</p>
    <div class="reply-box">{{ reply.message }}</div>
    <p style="text-align:center;">
      <a href="{{ frontend_url }}/my-feedback" class="btn" style="display:inline-block; background:#6c63ff; color:white; padding:12px 28px; border-radius:6px; text-decoration:none; margin-top:20px;">View Conversation</a>
    </p>
    <div class="footer">PyDocAI &mdash; AI-powered Python Documentation</div>
  </div>
</body>
</html>
