<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 40px; }
    .header { background: #1a1a2e; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; margin: -40px -40px 30px; }
    .btn { display: inline-block; background: #6c63ff; color: white; padding: 12px 28px; border-radius: 6px; text-decoration: none; margin-top: 20px; }
    .footer { color: #888; font-size: 13px; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Welcome to PyDocAI</h1></div>
    <p>Hi <strong>{{ user.name }}</strong>,</p>
    <p>Your account has been created successfully. You can now log in and start generating beautiful documentation for your Python projects automatically.</p>
    <p style="text-align:center;">
      <a href="{{ frontend_url }}/dashboard" class="btn">Get Started</a>
    </p>
    <div class="footer">PyDocAI &mdash; AI-powered Python Documentation</div>
  </div>
</body>
</html>
