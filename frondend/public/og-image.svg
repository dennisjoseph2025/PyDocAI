<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#080e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD43B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#3776AB" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="30" y1="0" x2="30" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/><line x1="90" y1="0" x2="90" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/><line x1="210" y1="0" x2="210" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="270" y1="0" x2="270" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="330" y1="0" x2="330" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="390" y1="0" x2="390" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/><line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="510" y1="0" x2="510" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/><line x1="570" y1="0" x2="570" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="630" y1="0" x2="630" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/><line x1="690" y1="0" x2="690" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/><line x1="810" y1="0" x2="810" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="870" y1="0" x2="870" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="930" y1="0" x2="930" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="990" y1="0" x2="990" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1110" y1="0" x2="1110" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/><line x1="1170" y1="0" x2="1170" y2="630"/>
  </g>
  <!-- Glow -->
  <ellipse cx="600" cy="315" rx="500" ry="280" fill="url(#glow)"/>
  <!-- Code decoration left -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#3776AB" opacity="0.3">
    <text x="60" y="120">from django.db import models</text>
    <text x="60" y="150">class Article(models.Model):</text>
    <text x="100" y="180">title = models.CharField(max_length=200)</text>
    <text x="100" y="210">content = models.TextField()</text>
    <text x="100" y="240">author = models.ForeignKey('auth.User',</text>
    <text x="120" y="270">on_delete=models.CASCADE</text>
    <text x="100" y="300">)</text>
    <text x="100" y="330">created_at = models.DateTimeField(auto_now_add=True)</text>
    <text x="60" y="360">class Meta:</text>
    <text x="100" y="390">ordering = ['-created_at']</text>
  </g>
  <!-- Code decoration right -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#FFD43B" opacity="0.2">
    <text x="750" y="150">| Field | Type | Description |</text>
    <text x="750" y="180">|-------|------|-------------|</text>
    <text x="750" y="210">| title | CharField | Headline |</text>
    <text x="750" y="240">| slug | SlugField | URL handle |</text>
    <text x="750" y="270">| author | ForeignKey | User ref |</text>
    <text x="750" y="300">| status | CharField | State enum |</text>
    <text x="750" y="360">GET /api/articles/</text>
    <text x="750" y="390">POST /api/articles/</text>
  </g>
  <!-- Main title -->
  <text font-family="'Syne', sans-serif" font-weight="800" font-size="96" fill="#E2E8F0" x="600" y="340" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#3776AB">Py</tspan><tspan fill="#FFD43B">Doc</tspan><tspan fill="#E2E8F0">AI</tspan>
  </text>
  <!-- Subtitle -->
  <text font-family="'DM Sans', sans-serif" font-weight="500" font-size="28" fill="#8892B0" x="600" y="400" text-anchor="middle" letter-spacing="1">
    AI-Powered Python Documentation Generator
  </text>
  <!-- Tagline -->
  <rect x="370" y="445" width="460" height="40" rx="20" fill="#3776AB" opacity="0.15" stroke="#3776AB" stroke-opacity="0.3" stroke-width="1"/>
  <text font-family="'DM Sans', sans-serif" font-weight="400" font-size="18" fill="#8892B0" x="600" y="471" text-anchor="middle">
    Upload · Parse · Generate
  </text>
  <!-- Bottom accent line -->
  <rect x="400" y="550" width="400" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
