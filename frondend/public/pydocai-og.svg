<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3776AB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#2B5F8A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0f1a"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#3776AB" stroke-width="0.8">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- PyDocAI logo top-left -->
  <text font-family="'Syne', 'Segoe UI', sans-serif" font-weight="800" font-size="28" x="50" y="65">
    <tspan fill="#E2E8F0">Py</tspan><tspan fill="#FFD43B">Doc</tspan><tspan fill="#E2E8F0">AI</tspan>
  </text>

  <!-- Divisor line below logo -->
  <line x1="50" y1="80" x2="200" y2="80" stroke="#1e2a3a" stroke-width="1"/>

  <!-- Hero heading -->
  <text font-family="'Syne', 'Segoe UI', sans-serif" font-weight="800" font-size="88" x="600" y="310" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#3776AB">Python</tspan><tspan fill="#E2E8F0"> Docs,</tspan>
  </text>
  <text font-family="'Syne', 'Segoe UI', sans-serif" font-weight="800" font-size="88" x="600" y="390" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#FFD43B">generated</tspan><tspan fill="#E2E8F0">.</tspan>
  </text>

  <!-- Subtitle -->
  <text font-family="'DM Sans', 'Segoe UI', sans-serif" font-weight="400" font-size="22" fill="#8892B0" x="600" y="445" text-anchor="middle">
    Upload your Django project and let AI produce beautiful, comprehensive docs
  </text>
  <text font-family="'DM Sans', 'Segoe UI', sans-serif" font-weight="400" font-size="22" fill="#8892B0" x="600" y="475" text-anchor="middle">
    — models, views, endpoints, and more.
  </text>

  <!-- Start for Free button -->
  <rect x="380" y="520" width="200" height="48" rx="24" fill="url(#btnAccent)"/>
  <text font-family="'DM Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#FFFFFF" x="480" y="550" text-anchor="middle">Start for Free →</text>

  <!-- See How It Works button -->
  <rect x="620" y="520" width="200" height="48" rx="24" fill="none" stroke="#2a3a52" stroke-width="1.5"/>
  <text font-family="'DM Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="17" fill="#8892B0" x="720" y="550" text-anchor="middle">See How It Works</text>

  <!-- Tech badges -->
  <g>
    <rect x="240" y="585" height="28" rx="14" fill="#111827"/>
    <rect x="240" y="585" width="72" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="276" y="604" text-anchor="middle">Django</text>
  </g>
  <g>
    <rect x="322" y="585" width="52" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="348" y="604" text-anchor="middle">DRF</text>
  </g>
  <g>
    <rect x="384" y="585" width="98" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="433" y="604" text-anchor="middle">Python 3.x</text>
  </g>
  <g>
    <rect x="492" y="585" width="96" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="540" y="604" text-anchor="middle">REST APIs</text>
  </g>
  <g>
    <rect x="598" y="585" width="78" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="637" y="604" text-anchor="middle">Models</text>
  </g>
  <g>
    <rect x="686" y="585" width="98" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="735" y="604" text-anchor="middle">Serializers</text>
  </g>
  <g>
    <rect x="794" y="585" width="66" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="827" y="604" text-anchor="middle">Views</text>
  </g>
  <g>
    <rect x="870" y="585" width="58" height="28" rx="14" fill="none" stroke="#1e2a3a" stroke-width="1"/>
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#8892B0" x="899" y="604" text-anchor="middle">URLs</text>
  </g>
</svg>
